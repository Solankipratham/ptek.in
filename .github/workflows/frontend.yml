name: ptek frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DO_SSH_PRIVATE_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
           
      - name: checking npm version
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_IP }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            npm -v
      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Check dist folder contents
        run: |
          if [ -d "dist" ]; then
            ls -la dist
          else
            echo "Dist directory not found!"
            exit 1
          fi
      - name: Remove existing files on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_IP }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo rm -rf /var/www/ptek.in/*
      - name: Copy files to server
        if: success()
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DO_IP }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/ptek.in"
          debug: true

      - name: Move dist contents to target directory
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_IP }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo mv /var/www/ptek.in/dist/* /var/www/ptek.in/
            sudo rm -rf /var/www/ptek.in/dist
            
      - name: Test SSH connection
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_IP }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            ls /var/www/ptek.in  # List files to verify connection
      - name: Restart Apache
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_IP }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo systemctl restart apache2
